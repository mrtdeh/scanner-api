version: "3.9"

services:

  api-service:
    image: mrtdeh/api
    environment:
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8080
      - SCANNER_ADDR=scanner-service:10000
    ports:
      - "8080:8080" 


  scanner-service:
    image: mrtdeh/scanner
    environment:
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=10000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock




  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongodb_data:/data/db


